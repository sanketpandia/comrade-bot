              schema:
                $ref: '#/components/schemas/CreateServerErrorResponse'
              examples:
                invalidRequest:
                  value:
                    error:
                      code: INVALID_REQUEST
                      message: Invalid request body
                invalidVaCode:
                  value:
                    error:
                      code: INVALID_VA_CODE
                      message: Invalid VA code
                userNotFound:
                  value:
