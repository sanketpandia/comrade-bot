components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: UUID of an active row in the api_keys table.
    CookieAuth:
      type: apiKey
      in: cookie
      name: session_id
      description: Browser session cookie minted by GET /auth/login.
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
        started_at:
          type: string
          format: date-time
        uptime:
          type: string
