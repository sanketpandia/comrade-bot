      enum:
        - INVALID_REQUEST
        - INVALID_VA_CODE
        - USER_NOT_FOUND
        - UNAUTHORIZED
        - MISSING_DISCORD_CONTEXT
        - SERVER_ALREADY_VA
        - VA_CODE_TAKEN
        - INIT_FAILED
    CreateServerErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
