      required:
        - webhookType
      properties:
        webhookType:
          type: string
          minLength: 1
          description: WEBHOOKS feature key (for example `active_flights`).
          example: active_flights
    VAWebhookTriggerData:
      type: object
      required:
        - webhookType
        - outcome
      properties:
        webhookType:
          type: string
          description: Feature key that was dispatched.
        outcome:
