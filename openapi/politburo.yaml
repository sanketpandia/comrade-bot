          in: header
          required: true
          description: Discord user id of the member initializing the server.
          schema:
            type: string
        - name: X-Discord-Server-Id
          in: header
          required: true
          description: Discord guild id to bind as a VA.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServerRequest'
      responses:
        '200':
          description: Virtual airline created and guild bound
