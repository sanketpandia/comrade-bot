openapi: 3.0.3
info:
  title: Infinite Flight Public API v3 (Live preview)
  version: 3.0.0-preview
  description: |
    **Preview — not a stable contract.** PublicApi v3 OAuth and Live organization endpoints may change
    before general availability (paths, scopes, fields, enums, validation, rate limits, and app review).

    PublicApi v3 adds OAuth2 access for third-party apps. Live endpoints focus on authenticated
    organization workflows: organizations and roles, members (roles and active lifts), aircraft and
    flight logs, and schedule read/write where permitted. The existing v2 API-key Live API is unchanged.

    **OAuth clients:** create at https://infiniteflight.com/account/api-keys (v3 OAuth2 clients section;
    up to 2 clients per user). Testing clients are limited to the owner and up to 5 invited test users
    until app review. Live endpoints only return organizations the signed-in user belongs to.

    **OAuth2:** authorization code flow with PKCE (required for all client types). Authorization server
    `https://api.infiniteflight.com/auth/v2` (`/connect/authorize`, `/connect/token`). User sign-in UI
    is hosted at `auth.infiniteflight.com`. **Issuer:** `https://auth.infiniteflight.com/`. Token requests use
    `application/x-www-form-urlencoded`. Scopes are space-delimited in the authorize request.

    **Client types** (`OAuthClientType`): confidential — exchange the code from your backend with
    `client_secret` + PKCE; public — `client_id` + `code_verifier` only. Never put client secrets in
    browser, mobile, or downloadable clients. Access tokens are audience `public-api-v3`; treat as opaque.
    Refresh tokens rotate — store the latest from each token response.

    **Data use:** API usage and data rules apply as for Live API v2. Live data is for simulated-flight
    features only; do not store, accumulate, share, or use it to train AI models.

    Response envelope: `{ "errorCode": 0, "result": { ... } }` — `errorCode: 0` means success.
tags:
  - name: OAuth2
    description: |
      OAuth2 authorization code + PKCE. Create clients at https://infiniteflight.com/account/api-keys.
      Sample flows: https://github.com/infiniteflight/infiniteflight-api-playground
  - name: Organizations
    description: Live organizations the signed-in user belongs to.
  - name: Members
    description: Organization members, roles, and active lifts.
  - name: Aircraft
    description: Organization aircraft, position, and flight logs.
  - name: Schedules
    description: Fleet and per-aircraft schedules; write operations require owner or admin role.
servers:
  - url: https://api.infiniteflight.com/public/v3
    description: PublicApi v3 (Live endpoints)
  - url: https://api.infiniteflight.com/auth/v2
    description: OAuth2 authorization server (`/connect/*`)
