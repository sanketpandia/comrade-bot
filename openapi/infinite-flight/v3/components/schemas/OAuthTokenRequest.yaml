type: object
required: [grant_type, client_id]
properties:
  grant_type:
    type: string
    enum: [authorization_code, refresh_token]
  client_id:
    type: string
    description: OAuth client id (for example `ifc_your_client_id`).
  client_secret:
    type: string
    description: |
      Required for **confidential** clients on token exchange and refresh. Do not send for **public** clients;
      no client secret is issued or accepted for public clients.
  code:
    type: string
    description: Authorization code from the redirect (`grant_type=authorization_code`).
  redirect_uri:
    type: string
    format: uri
    description: Must match the registered redirect URI used in the authorization request (`grant_type=authorization_code`).
  code_verifier:
    type: string
    description: PKCE code verifier (`grant_type=authorization_code`). Required for all client types.
  refresh_token:
    type: string
    description: Stored refresh token (`grant_type=refresh_token`).
