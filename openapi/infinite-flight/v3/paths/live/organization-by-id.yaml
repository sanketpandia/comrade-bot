get:
  operationId: getLiveOrganization
  summary: Get organization
  description: |
    Returns one **active** organization when the signed-in user is a member.

    **Authorization:** `Authorization: Bearer <access_token>` with scope `live:organizations.read`.
    The signed-in user must be a member of the organization; otherwise the API returns `404`.

    `result.role` is the signed-in user's role in that organization.
  tags: [Organizations]
  security:
    - oauth2: [live:organizations.read]
  parameters:
    - $ref: ../../components/parameters/organizationId.yaml
  responses:
    "200":
      description: Success (`errorCode` is `0`).
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/responses/GetOrganizationResponse.yaml
    "400":
      $ref: ../../components/responses/PublicApiErrors.yaml#/BadRequest
    "401":
      $ref: ../../components/responses/PublicApiErrors.yaml#/Unauthorized
    "403":
      $ref: ../../components/responses/PublicApiErrors.yaml#/Forbidden
    "404":
      $ref: ../../components/responses/PublicApiErrors.yaml#/NotFound
    "429":
      $ref: ../../components/responses/PublicApiErrors.yaml#/TooManyRequests
