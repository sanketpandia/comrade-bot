get:
  operationId: getLiveAircraftPosition
  summary: Get aircraft position
  description: |
    Returns the aircraft's last persisted Live position and state when the signed-in user belongs to the
    owning organization.

    **Authorization:** `Authorization: Bearer <access_token>` with scope `live:aircraft.read`.
    The signed-in user must be a member of the aircraft's organization; otherwise the API returns `404`.

    This is stored Live aircraft state and can be **stale** when the aircraft is not actively reporting.
    To check whether the aircraft is currently active in multiplayer, compare this `result.id` with v2
    `FlightEntry.flightId` from `GET /public/v2/sessions/{sessionId}/flights`.
  tags: [Aircraft]
  security:
    - oauth2: [live:aircraft.read]
  parameters:
    - $ref: ../../components/parameters/aircraftId.yaml
  responses:
    "200":
      description: Success (`errorCode` is `0`).
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/responses/GetAircraftPositionResponse.yaml
    "400":
      $ref: ../../components/responses/PublicApiErrors.yaml#/BadRequest
    "401":
      $ref: ../../components/responses/PublicApiErrors.yaml#/Unauthorized
    "403":
      $ref: ../../components/responses/PublicApiErrors.yaml#/Forbidden
    "404":
      $ref: ../../components/responses/PublicApiErrors.yaml#/NotFound
    "429":
      $ref: ../../components/responses/PublicApiErrors.yaml#/TooManyRequests
