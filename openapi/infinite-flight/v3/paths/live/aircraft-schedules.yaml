post:
  operationId: createLiveSchedule
  summary: Create schedule
  description: |
    Creates a schedule on a Live aircraft.
    Requires organization owner or admin role in addition to the `live:schedules.write` scope.
  tags: [Schedules]
  security:
    - oauth2: [live:schedules.write]
  parameters:
    - $ref: ../../components/parameters/aircraftId.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          description: Request body — detailed fields pending Data Types documentation.
  responses:
    "200":
      description: Success (`errorCode` is `0`).
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/PublicApiResponse.yaml
    "400":
      $ref: ../../components/responses/PublicApiErrors.yaml#/BadRequest
    "401":
      $ref: ../../components/responses/PublicApiErrors.yaml#/Unauthorized
    "403":
      $ref: ../../components/responses/PublicApiErrors.yaml#/Forbidden
    "404":
      $ref: ../../components/responses/PublicApiErrors.yaml#/NotFound
    "429":
      $ref: ../../components/responses/PublicApiErrors.yaml#/TooManyRequests
get:
  operationId: listLiveAircraftSchedules
  summary: List aircraft schedules
  description: |
    Returns schedules for the aircraft, ordered by `sequence`.

    **Authorization:** `Authorization: Bearer <access_token>` with scope `live:schedules.read`.
    The signed-in user must be a member of the aircraft's organization; otherwise the API returns `404`.
  tags: [Schedules]
  security:
    - oauth2: [live:schedules.read]
  parameters:
    - $ref: ../../components/parameters/aircraftId.yaml
  responses:
    "200":
      description: Success (`errorCode` is `0`).
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/responses/ListAircraftSchedulesResponse.yaml
    "400":
      $ref: ../../components/responses/PublicApiErrors.yaml#/BadRequest
    "401":
      $ref: ../../components/responses/PublicApiErrors.yaml#/Unauthorized
    "403":
      $ref: ../../components/responses/PublicApiErrors.yaml#/Forbidden
    "404":
      $ref: ../../components/responses/PublicApiErrors.yaml#/NotFound
    "429":
      $ref: ../../components/responses/PublicApiErrors.yaml#/TooManyRequests
