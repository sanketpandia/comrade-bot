get:
  operationId: listLiveOrganizationSchedules
  summary: List organization schedules
  description: |
    Returns **open** schedules for the organization's fleet in one request. Open schedules are all
    schedules that are not Cancelled and not Arrived. Results are sorted by aircraft, then by `sequence`.

    **Authorization:** `Authorization: Bearer <access_token>` with scope `live:schedules.read`.
    The signed-in user must be a member of the organization; otherwise the API returns `404`.

    `result` is a page of `Schedule` objects (`result.items`). List responses may show a subset of
    fields in documentation samples; each item includes all `Schedule` fields.
  tags: [Schedules]
  security:
    - oauth2: [live:schedules.read]
  parameters:
    - $ref: ../../components/parameters/organizationId.yaml
    - $ref: ../../components/parameters/queryAircraftIds.yaml
    - $ref: ../../components/parameters/page.yaml
    - $ref: ../../components/parameters/pageSize.yaml
  responses:
    "200":
      description: Success (`errorCode` is `0`).
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/responses/ListOrganizationSchedulesResponse.yaml
    "400":
      $ref: ../../components/responses/PublicApiErrors.yaml#/BadRequest
    "401":
      $ref: ../../components/responses/PublicApiErrors.yaml#/Unauthorized
    "403":
      $ref: ../../components/responses/PublicApiErrors.yaml#/Forbidden
    "404":
      $ref: ../../components/responses/PublicApiErrors.yaml#/NotFound
    "429":
      $ref: ../../components/responses/PublicApiErrors.yaml#/TooManyRequests
