get:
  operationId: listLiveOrganizationAircraft
  summary: List organization aircraft
  description: |
    Returns **active** aircraft for the organization.

    **Authorization:** `Authorization: Bearer <access_token>` with scope `live:aircraft.read`.
    The signed-in user must be a member of the organization; otherwise the API returns `404`.

    Use each item's `id` as `{aircraftId}` in `/live/aircraft/{aircraftId}` and schedule routes.
    `aircraftId` is the Infinite Flight content identifier, not the persistent organization aircraft ID.

    `visibility` is visible vs hangared, separate from fleet storage. Aircraft outside active fleet slots
    have `isFleetActiveSlot: false` and may appear as storage in the Live portal even when visibility is Visible.
  tags: [Aircraft]
  security:
    - oauth2: [live:aircraft.read]
  parameters:
    - $ref: ../../components/parameters/organizationId.yaml
  responses:
    "200":
      description: Success (`errorCode` is `0`).
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/responses/ListOrganizationAircraftResponse.yaml
    "400":
      $ref: ../../components/responses/PublicApiErrors.yaml#/BadRequest
    "401":
      $ref: ../../components/responses/PublicApiErrors.yaml#/Unauthorized
    "403":
      $ref: ../../components/responses/PublicApiErrors.yaml#/Forbidden
    "404":
      $ref: ../../components/responses/PublicApiErrors.yaml#/NotFound
    "429":
      $ref: ../../components/responses/PublicApiErrors.yaml#/TooManyRequests
