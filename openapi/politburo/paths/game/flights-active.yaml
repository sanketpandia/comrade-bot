get:
  operationId: getActiveFlights
  summary: Read cached active Infinite Flight flights for a server
  security:
    - ApiKeyAuth: []
    - CookieAuth: []
  parameters:
    - name: serverId
      in: query
      required: true
      description: Normalized session name (for example casual).
      schema:
        type: string
    - name: pilotState
      in: query
      style: form
      explode: true
      description: Restrict results to one or more pilot states.
      schema:
        type: array
        items:
          $ref: "../../components/schemas/PilotStateName.yaml"
    - name: userName
      in: query
      description: Restrict results to flights whose username contains this value.
      schema:
        type: string
    - name: callSign
      in: query
      description: Restrict results to flights whose callsign contains this value.
      schema:
        type: string
    - name: pageNumber
      in: query
      description: 1-based page of filtered flights to return.
      schema:
        type: integer
        minimum: 1
        default: 1
    - name: pageLength
      in: query
      description: Number of flights per page.
      schema:
        type: integer
        minimum: 1
        default: 50
  responses:
    "200":
      description: The latest cached active flights for the server
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ActiveFlightsResponse.yaml"
    "400":
      description: An invalid filter value was supplied
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
    "401":
      description: Missing or inactive API key or session cookie
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
    "500":
      description: The cache entry could not be read
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
    "503":
      description: No active-flight snapshot is currently cached for the server
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
