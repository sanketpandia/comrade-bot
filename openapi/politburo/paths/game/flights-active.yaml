get:
  operationId: getActiveFlights
  summary: Read cached active flight motion tracks for a server
  tags: [Game]
  parameters:
    - name: normalizedServerName
      in: path
      required: true
      description: Normalized Infinite Flight session name (for example casual).
      schema:
        type: string
    - name: pageNumber
      in: query
      description: 1-based page of flight tracks to return.
      schema:
        type: integer
        minimum: 1
        default: 1
    - name: pageLength
      in: query
      description: Number of flights per page (max 5000).
      schema:
        type: integer
        minimum: 1
        maximum: 5000
        default: 50
    - name: pilotState
      in: query
      style: form
      explode: true
      description: Restrict results to one or more pilot states.
      schema:
        type: array
        items:
          $ref: "../../components/schemas/PilotStateName.yaml"
    - name: userName
      in: query
      description: Restrict results to flights whose username contains this value.
      schema:
        type: string
    - name: callSign
      in: query
      description: Restrict results to flights whose callsign contains this value.
      schema:
        type: string
    - name: vaCode
      in: query
      description: |
        Restrict results to flights matched to this active virtual airline code (case-insensitive).
        Resolved from the cached VA code index and per-VA active-flight index written by the
        `infinite-flight-va-flight-index` job; the database is never queried.
      schema:
        type: string
  responses:
    "200":
      description: The latest cached motion tracks for active flights on the server
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ActiveFlightsResponse.yaml"
    "400":
      description: An invalid query value was supplied, or `vaCode` is not an active virtual airline
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
    "500":
      description: The cache entry could not be read
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
    "503":
      description: No active-flight snapshot is currently cached for the server, or the VA flight index is not cached yet when `vaCode` is set
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
