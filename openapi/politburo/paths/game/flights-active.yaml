get:
  operationId: getActiveFlights
  summary: Read cached active flight motion tracks for a server
  tags: [Game]
  security:
    - ApiKeyAuth: []
    - CookieAuth: []
  parameters:
    - name: normalizedServerName
      in: path
      required: true
      description: Normalized Infinite Flight session name (for example casual).
      schema:
        type: string
    - name: pageNumber
      in: query
      description: 1-based page of flight tracks to return.
      schema:
        type: integer
        minimum: 1
        default: 1
    - name: pageLength
      in: query
      description: Number of flights per page (max 5000).
      schema:
        type: integer
        minimum: 1
        maximum: 5000
        default: 50
  responses:
    "200":
      description: The latest cached motion tracks for active flights on the server
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ActiveFlightsResponse.yaml"
    "400":
      description: An invalid query value was supplied
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
    "401":
      description: Missing or inactive API key or session cookie
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
    "500":
      description: The cache entry could not be read
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
    "503":
      description: No active-flight snapshot is currently cached for the server
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
