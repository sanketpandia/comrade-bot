get:
  operationId: getActiveFlight
  summary: Read cached enriched record for one active flight
  tags: [Game]
  security:
    - ApiKeyAuth: []
    - CookieAuth: []
  parameters:
    - name: flightId
      in: path
      required: true
      description: Infinite Flight flight identifier (UUID).
      schema:
        type: string
        format: uuid
  responses:
    "200":
      description: The latest cached enriched flight record
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ActiveFlightRecordResponse.yaml"
    "400":
      description: An invalid flight identifier was supplied
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
    "401":
      description: Missing or inactive API key or session cookie
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
    "404":
      description: No cached record exists for the flight
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
    "500":
      description: The cache entry could not be read
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
