get:
  operationId: getActiveSessions
  summary: Read the latest active Infinite Flight sessions from cache
  tags: [Game]
  security:
    - ApiKeyAuth: []
    - CookieAuth: []
  parameters:
    - name: history
      in: query
      description: Include the last 50 cached results when history support is available.
      schema:
        type: boolean
        default: false
  responses:
    "200":
      description: The latest cached active sessions
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ActiveSessionsResponse.yaml"
    "400":
      description: An invalid filter value was supplied
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
    "401":
      description: Missing or inactive API key or session cookie
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
    "500":
      description: The cache entry could not be read
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
    "503":
      description: No active-session snapshot is currently cached
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
