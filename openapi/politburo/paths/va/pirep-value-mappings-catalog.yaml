get:
  operationId: getVAPIREPValueMappingsCatalog
  summary: Paginated catalog names for the value-mapping editor
  tags: [VirtualAirline]
  security:
    - ApiKeyAuth: []
    - CookieAuth: []
  parameters:
    - name: kind
      in: query
      required: true
      schema:
        type: string
        enum: [aircraft, airline]
    - name: search
      in: query
      schema:
        type: string
    - name: limit
      in: query
      schema:
        type: integer
        default: 50
    - name: offset
      in: query
      schema:
        type: integer
        default: 0
  responses:
    "200":
      description: Name groups
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  total:
                    type: integer