get:
  operationId: listVALiveOrganizationFlights
  summary: List flight history for a registration in a linked Live org
  description: |
    Returns one page of flight log entries for aircraft matching the given registration
    in the linked organisation's fleet. Uses the VA's Infinite Flight OAuth grant.
    Requires VA membership (any role on the current server).
  tags: [VirtualAirline]
  security:
    - ApiKeyAuth: []
    - CookieAuth: []
  parameters:
    - name: organizationId
      in: path
      required: true
      description: Infinite Flight Live organisation id
      schema:
        type: string
        format: uuid
    - name: registration
      in: query
      required: true
      description: Organization aircraft registration (e.g. PH-ZNB).
      schema:
        type: string
    - name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    - name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  responses:
    "200":
      description: Flight history page
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/LiveAircraftFlightsResponse.yaml"
    "400":
      description: Invalid query filter
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
    "401":
      description: Missing or inactive API key or session cookie
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
    "403":
      description: Caller is not a VA member
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
    "404":
      description: VA context, organisation link, or registration not in fleet
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
    "409":
      description: VA Live OAuth grant missing or needs reconnect
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
    "502":
      description: Infinite Flight Live API request failed
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
    "503":
      description: Infinite Flight Live API is not configured
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
    "500":
      description: Internal error
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
