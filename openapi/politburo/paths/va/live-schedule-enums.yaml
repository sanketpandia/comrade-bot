get:
  operationId: listVALiveScheduleEnums
  summary: Live schedule field enum names
  description: |
    Returns the string enum values used for `status`, `flightType`, and schedule `crew.role`
    on Live schedule API responses and write bodies. Upstream Infinite Flight uses integers;
    Politburo
    exposes these names for the portal and Discord bot.
    Requires VA staff role (`bourgeoisie` or `administrator`).
  tags: [VirtualAirline]
  security:
    - ApiKeyAuth: []
    - CookieAuth: []
  responses:
    "200":
      description: Enum name lists
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/LiveScheduleEnumsResponse.yaml"
    "401":
      description: Missing or inactive API key or session cookie
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
    "403":
      description: Caller is not VA staff
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
    "500":
      description: Internal error
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
