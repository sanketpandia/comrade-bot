get:
  operationId: listVALiveScheduleBookings
  summary: List recent crew self-assignments for this VA
  description: |
    Returns `assign_va_live_schedule_crew` action history rows for the caller's virtual airline,
    newest first. Requires VA staff role (`bourgeoisie` or `administrator`).
  tags: [VirtualAirline]
  security:
    - ApiKeyAuth: []
    - CookieAuth: []
  parameters:
    - name: organizationId
      in: query
      required: false
      description: When set, only rows for this Infinite Flight live organisation are returned.
      schema:
        type: string
        format: uuid
  responses:
    "200":
      description: Booking history
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: array
                items:
                  $ref: "../../components/schemas/LiveScheduleBookingItem.yaml"
    "401":
      description: Missing or inactive API key or session cookie
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
    "403":
      description: Caller is not VA staff
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
    "404":
      description: No virtual airline context
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
    "500":
      description: Internal error
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
