get:
  operationId: pingVALiveConnection
  summary: Verify Live API access for a linked organisation
  description: |
    Calls Infinite Flight Live API for the linked organisation using this VA's OAuth grant.
    Requires VA staff role (`bourgeoisie` or `administrator`).

    Staff access may be tightened once persistence supports per-org real-time access checks.
  tags: [VirtualAirline]
  security:
    - ApiKeyAuth: []
    - CookieAuth: []
  parameters:
    - name: organizationId
      in: path
      required: true
      description: Infinite Flight Live organisation id
      schema:
        type: string
        format: uuid
  responses:
    "200":
      description: Organisation reachable with the VA grant
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/VALiveConnectionPingResponse.yaml"
    "401":
      description: Missing or inactive API key or session cookie
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
    "403":
      description: Caller is not VA staff (bourgeoisie or administrator)
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
    "404":
      description: Connection or VA context not found
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
    "409":
      description: VA Live OAuth grant missing or needs reconnect
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
    "502":
      description: Infinite Flight Live API request failed
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
    "500":
      description: Failed to ping connection
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
