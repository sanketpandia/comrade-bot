post:
  operationId: assignVALiveScheduleToMe
  summary: Assign the caller as captain on a matched open schedule
  description: |
    Finds the first open schedule in the linked organisation whose aircraft registration
    and ORIG-DEST route match the request, then assigns the caller as **Captain** via
    Infinite Flight `PUT /live/schedules/{scheduleId}/crew/{userId}`.
    Uses the VA's OAuth grant (`live:schedules.write`). Requires VA membership.
  tags: [VirtualAirline]
  security:
    - ApiKeyAuth: []
    - CookieAuth: []
  parameters:
    - name: organizationId
      in: path
      required: true
      description: Infinite Flight Live organisation id
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/LiveScheduleAssignMeBody.yaml"
  responses:
    "200":
      description: Schedule crew assignment succeeded
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                $ref: "../../components/schemas/LiveScheduleAssignMeResponse.yaml"
    "400":
      description: Invalid registration, route, or body
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
    "401":
      description: Missing or inactive API key or session cookie
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
    "403":
      description: Caller is not a VA member
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
    "404":
      description: User, link, registration, or matching schedule not found
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
    "409":
      description: VA Live OAuth grant missing or needs reconnect
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
    "502":
      description: Infinite Flight Live API request failed
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
    "503":
      description: Infinite Flight Live API is not configured
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
    "500":
      description: Internal error
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
