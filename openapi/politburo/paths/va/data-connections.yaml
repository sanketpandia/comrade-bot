get:
  operationId: getVADataConnections
  summary: Get VA data connection configuration
  description: Returns the redacted data connection configuration and field catalog. Requires VA administrator.
  tags: [VirtualAirline]
  security:
    - ApiKeyAuth: []
    - CookieAuth: []
  responses:
    "200":
      description: Configuration projection
      headers:
        ETag:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/VADataConnectionsResponse.yaml"
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
    "503":
      description: Data connections encryption key not configured
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"