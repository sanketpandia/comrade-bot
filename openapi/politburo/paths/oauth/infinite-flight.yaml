get:
  operationId: getInfiniteFlightOAuthAuthorize
  summary: Start Infinite Flight OAuth for the current user
  description: |
    Returns the Infinite Flight authorization URL for the current user. The Politburo
    user id is resolved the same way as `GET /api/v1/user/me` (session cookie, or API
    key plus `X-Discord-User-Id`). Politburo stores short-lived PKCE state in Redis;
    the user completes consent at Infinite Flight and returns via `GET /oauth/callback`.

    Requires Infinite Flight OAuth client credentials on the server.

    Use query `scope_set=admin_scopes` for the VA administrator Live Mode grant (requires virtual airline context on the caller).
  tags: [Auth]
  security:
    - ApiKeyAuth: []
    - CookieAuth: []
  parameters:
    - name: scope_set
      in: query
      required: false
      description: |
        OAuth scope bundle. `admin_scopes` requests the VA staff grant including refresh and schedule write.
        Omitted uses read-only user scopes.
      schema:
        type: string
        enum: [admin_scopes]
  responses:
    "200":
      description: Authorize URL for the browser
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/InfiniteFlightOAuthAuthorizeResponse.yaml"
    "401":
      description: Missing session or Discord user id
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
    "404":
      description: User record not found
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
    "400":
      description: Invalid scope set or missing VA context for admin scopes
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
    "503":
      description: Infinite Flight OAuth is not configured on this deployment
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
    "500":
      description: Could not start OAuth
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
