post:
  operationId: createServer
  summary: Bootstrap a Discord guild as a virtual airline
  description: |
    Binds the Discord guild in X-Discord-Server-Id to a new VA with the given code.
    The caller (X-Discord-User-Id) must already be a registered Politburo user and
    becomes VA administrator.

    Error responses use `error.code` from the CreateServerErrorCode enum.
  tags: [Users]
  security:
    - ApiKeyAuth: []
  parameters:
    - name: X-Discord-User-Id
      in: header
      required: true
      description: Discord user id of the member initializing the server.
      schema:
        type: string
    - name: X-Discord-Server-Id
      in: header
      required: true
      description: Discord guild id to bind as a VA.
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/CreateServerRequest.yaml"
  responses:
    "200":
      description: Virtual airline created and guild bound
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/CreateServerResponse.yaml"
    "400":
      description: Invalid request, VA code, or user not registered
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/CreateServerErrorResponse.yaml"
          examples:
            invalidRequest:
              value:
                error:
                  code: INVALID_REQUEST
                  message: Invalid request body
            invalidVaCode:
              value:
                error:
                  code: INVALID_VA_CODE
                  message: Invalid VA code
            userNotFound:
              value:
                error:
                  code: USER_NOT_FOUND
                  message: You must register as a user before initializing a server
    "401":
      description: Missing or inactive API key
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/CreateServerErrorResponse.yaml"
          examples:
            unauthorized:
              value:
                error:
                  code: UNAUTHORIZED
                  message: Unauthorized
    "403":
      description: Missing Discord context headers
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/CreateServerErrorResponse.yaml"
          examples:
            missingDiscordContext:
              value:
                error:
                  code: MISSING_DISCORD_CONTEXT
                  message: "Missing required Discord context headers: X-Discord-User-Id and X-Discord-Server-Id"
    "409":
      description: Guild or VA code already taken
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/CreateServerErrorResponse.yaml"
          examples:
            serverAlreadyVa:
              value:
                error:
                  code: SERVER_ALREADY_VA
                  message: This Discord server is already registered as a VA
            vaCodeTaken:
              value:
                error:
                  code: VA_CODE_TAKEN
                  message: This VA code is already in use
    "500":
      description: Internal initialization failure
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/CreateServerErrorResponse.yaml"
          examples:
            initFailed:
              value:
                error:
                  code: INIT_FAILED
                  message: initialization failed
