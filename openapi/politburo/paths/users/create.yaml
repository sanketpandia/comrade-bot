post:
  operationId: createUser
  summary: Register a Discord user with IFC identity and logbook proof
  description: |
    Creates a global Politburo user for the Discord member in X-Discord-User-Id.
    Requires X-Discord-Server-Id (bot context). Verifies the IFC username resolves
    upstream and that logbookEntry matches the latest complete online logbook flight.

    Error responses use `error.code` from the CreateUserErrorCode enum (see response examples).
  tags: [Users]
  security:
    - ApiKeyAuth: []
  parameters:
    - name: X-Discord-User-Id
      in: header
      required: true
      description: Discord user id of the member registering.
      schema:
        type: string
    - name: X-Discord-Server-Id
      in: header
      required: true
      description: Discord guild id for bot context and VA registration hint.
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/CreateUserRequest.yaml"
  responses:
    "200":
      description: User registered
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/CreateUserResponse.yaml"
    "400":
      description: Invalid request body or flight proof failed
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/CreateUserErrorResponse.yaml"
          examples:
            invalidRequest:
              summary: Invalid request body
              value:
                error:
                  code: INVALID_REQUEST
                  message: discourseNames must contain exactly one IFC username
            flightProofFailed:
              summary: Logbook proof mismatch
              value:
                error:
                  code: FLIGHT_PROOF_FAILED
                  message: Flight validation failed
            registrationFailed:
              summary: Unclassified registration failure
              value:
                error:
                  code: REGISTRATION_FAILED
                  message: registration failed
    "401":
      description: Missing or inactive API key
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/CreateUserErrorResponse.yaml"
          examples:
            unauthorized:
              value:
                error:
                  code: UNAUTHORIZED
                  message: Unauthorized
    "403":
      description: Banned Discord account or missing Discord context headers
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/CreateUserErrorResponse.yaml"
          examples:
            banned:
              summary: Discord account is banned
              value:
                error:
                  code: BANNED
                  message: This Discord account cannot register
            missingDiscordContext:
              summary: Bot omitted required Discord headers
              value:
                error:
                  code: MISSING_DISCORD_CONTEXT
                  message: "Missing required Discord context headers: X-Discord-User-Id and X-Discord-Server-Id"
    "404":
      description: IFC user not found upstream
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/CreateUserErrorResponse.yaml"
          examples:
            ifUserNotFound:
              value:
                error:
                  code: IF_USER_NOT_FOUND
                  message: IFC user not found
    "409":
      description: Discord user or IFC username already registered
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/CreateUserErrorResponse.yaml"
          examples:
            userAlreadyRegistered:
              value:
                error:
                  code: USER_ALREADY_REGISTERED
                  message: User already registered
            ifcAlreadyLinked:
              value:
                error:
                  code: IFC_ALREADY_LINKED
                  message: IFC ID is already registered to another Discord account
    "503":
      description: Infinite Flight API unavailable
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/CreateUserErrorResponse.yaml"
          examples:
            ifUnavailable:
              value:
                error:
                  code: IF_UNAVAILABLE
                  message: Infinite Flight API is not configured
    "500":
      description: Authentication lookup or internal registration failure
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/CreateUserErrorResponse.yaml"
          examples:
            authLookupFailed:
              value:
                error:
                  code: AUTH_LOOKUP_FAILED
                  message: authentication lookup failed
