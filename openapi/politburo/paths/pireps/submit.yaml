post:
  operationId: submitPirep
  summary: Submit a PIREP for filing
  tags: [VirtualAirline]
  security:
    - ApiKeyAuth: []
    - CookieAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: true
  responses:
    "200":
      description: Submitted
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                additionalProperties: true
    "501":
      description: Filing provider not configured
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"