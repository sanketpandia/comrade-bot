get:
  operationId: getHealthStatus
  summary: Report process uptime and dependency readiness
  tags: [Health]
  responses:
    "200":
      description: The process is up and required dependencies are reachable
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/HealthResponse.yaml"
    "503":
      description: The process is up but a required dependency is unavailable
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/HealthResponse.yaml"
