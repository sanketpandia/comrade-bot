type: object
required: [speed, verticalSpeed, pilotState, isConnected]
properties:
  normalizedCallsign:
    type: string
    description: Callsign with Infinite Flight weight/formation trailers removed for VA affix matching.
  aircraftName:
    type: string
    description: Display aircraft name from the livery catalog.
  liveryName:
    type: string
    description: Display livery name from the livery catalog.
  departure:
    type: string
    description: Departure fix from the cached flight plan (first waypoint), when available.
  destination:
    type: string
    description: Destination or arrival fix from the cached flight plan (last waypoint), when available.
  speed:
    type: string
    description: Display-formatted ground speed (for example "186 kts").
  verticalSpeed:
    type: string
    description: Display-formatted vertical speed (for example "-434.3 ft/min").
  pilotState:
    $ref: "./PilotStateName.yaml"
  isConnected:
    type: string
    enum: [connected, disconnected]
    description: Human-readable connection status.
