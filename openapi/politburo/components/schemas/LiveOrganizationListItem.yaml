type: object
required: [id, name, role]
properties:
  id:
    type: string
    format: uuid
    description: Infinite Flight Live organization ID.
  name:
    type: string
    description: Organization display name.
  role:
    type: integer
    description: Caller role in the organization (`PersistentOrganizationMemberRole`). Only Admin (1) and Owner (2) are returned.
    enum: [1, 2]
