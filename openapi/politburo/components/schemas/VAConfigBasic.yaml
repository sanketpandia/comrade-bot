type: object
description: |
  Documented shape for BASIC va config (stored as opaque payload; validated server-side).
  `game_callsign.prefix`/`suffix` are trimmed and matched case-sensitively against live callsigns
  (prefix against the raw callsign; suffix against the raw or normalized callsign).
  `preferred_servers` are lowercased, trimmed, de-duplicated, and sorted; when empty the VA matches
  flights on every server.
additionalProperties: true
properties:
  game_callsign:
    type: object
    additionalProperties: true
    properties:
      prefix:
        type: string
      suffix:
        type: string
  preferred_servers:
    type: array
    description: Normalized Infinite Flight session names (e.g. casual, training, expert).
    items:
      type: string
      minLength: 1
