type: object
required:
  - id
  - status
  - callsign
  - organizationId
  - aircraftId
  - flightType
  - originIcao
  - destinationIcao
  - isTimeless
  - scheduledDepartureUtc
  - sequence
properties:
  id:
    type: string
    format: uuid
  status:
    $ref: "./LiveScheduleStatusName.yaml"
  callsign:
    type: string
  organizationId:
    type: string
    format: uuid
  aircraftId:
    type: string
    format: uuid
  flightType:
    $ref: "./LiveScheduleFlightTypeName.yaml"
  originIcao:
    type: string
  destinationIcao:
    type: string
  isTimeless:
    type: boolean
  scheduledDepartureUtc:
    type: string
    format: date-time
  scheduledArrivalUtc:
    type: string
    format: date-time
  briefing:
    type: string
    nullable: true
  debriefing:
    type: string
    nullable: true
  flightPlan:
    type: string
    nullable: true
  crew:
    type: array
    items:
      $ref: "./LiveScheduleCrewMember.yaml"
  createdAt:
    type: string
    format: date-time
  updatedAt:
    type: string
    format: date-time
  sequence:
    type: integer
