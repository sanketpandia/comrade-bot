type: object
required: [discourseNames, logbookEntry]
properties:
  discourseNames:
    type: array
    minItems: 1
    maxItems: 1
    items:
      type: string
      minLength: 1
    description: IFC Community username (same as Infinite Flight discourseNames lookup).
  logbookEntry:
    type: string
    pattern: ^[A-Z]{4}-[A-Z]{4}$
    description: Origin-destination proof for the pilot's latest complete online logbook flight (ICAO ORIG-DEST).
