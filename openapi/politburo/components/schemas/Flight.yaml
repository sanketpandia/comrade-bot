type: object
required:
  - flightId
  - userId
  - aircraftId
  - liveryId
  - callsign
  - latitude
  - longitude
  - altitude
  - speed
  - verticalSpeed
  - track
  - heading
  - lastReport
  - pilotState
  - isConnected
  - sessionId
  - normalizedName
  - normalized
properties:
  flightId:
    type: string
    format: uuid
  userId:
    type: string
    format: uuid
  aircraftId:
    type: string
    format: uuid
  liveryId:
    type: string
    format: uuid
  username:
    type: string
    nullable: true
  virtualOrganization:
    type: string
    nullable: true
  callsign:
    type: string
  latitude:
    type: number
    format: double
  longitude:
    type: number
    format: double
  altitude:
    type: integer
    description: Altitude in feet.
  speed:
    type: integer
    description: Groundspeed in knots.
  verticalSpeed:
    type: number
    format: double
    description: Vertical speed in ft/min.
  track:
    type: number
    format: double
  heading:
    type: number
    format: double
  lastReport:
    type: string
    format: date-time
  pilotState:
    type: integer
    description: "Active=0, AwayInFlight=1, AwayParked=2, InBackground=3."
  isConnected:
    type: boolean
  aircraftName:
    type: string
  liveryName:
    type: string
  sessionId:
    type: string
    format: uuid
  normalizedName:
    type: string
  normalized:
    $ref: "./FlightNormalized.yaml"
  pathSync:
    $ref: "./FlightPathSync.yaml"
