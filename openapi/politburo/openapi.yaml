openapi: 3.0.3
info:
  title: Politburo API
  version: 0.1.0
  description: Authoritative contract for the clean-slate Politburo application.
tags:
  - name: Health
    description: Process and dependency readiness.
  - name: Game
    description: Cached Infinite Flight live game data.
  - name: Auth
    description: Browser session and signed links.
  - name: Users
    description: Discord user registration and account flows.
  - name: Admin
    description: Platform operator (god mode) actions.
servers:
  - url: http://localhost:8080
    description: Local rewrite
paths:
  /health/status:
    $ref: "./paths/health/status.yaml"
  /api/v1/game/sessions/active:
    $ref: "./paths/game/sessions-active.yaml"
  /api/v1/game/flights/active:
    $ref: "./paths/game/flights-active.yaml"
  /api/v1/game/flights/active/trimmed:
    $ref: "./paths/game/flights-active-trimmed.yaml"
  /api/v1/game/flights/active/detail:
    $ref: "./paths/game/flights-active-detail.yaml"
  /api/v1/signed-link:
    $ref: "./paths/auth/signed-link.yaml"
  /api/v1/users:
    $ref: "./paths/users/create.yaml"
  /api/v1/servers:
    $ref: "./paths/servers/create.yaml"
  /api/v1/admin/verify-god:
    $ref: "./paths/admin/verify-god.yaml"
  /api/v1/admin/users/ban:
    $ref: "./paths/admin/ban-user.yaml"
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: UUID of an active row in the api_keys table.
    CookieAuth:
      type: apiKey
      in: cookie
      name: session_id
      description: Browser session cookie minted by GET /auth/login.
  schemas:
    HealthResponse:
      $ref: "./components/schemas/HealthResponse.yaml"
    ActiveSessionsResponse:
      $ref: "./components/schemas/ActiveSessionsResponse.yaml"
    ActiveSessionsData:
      $ref: "./components/schemas/ActiveSessionsData.yaml"
    AvailableFilter:
      $ref: "./components/schemas/AvailableFilter.yaml"
    CacheMetadata:
      $ref: "./components/schemas/CacheMetadata.yaml"
    SessionHistorySnapshot:
      $ref: "./components/schemas/SessionHistorySnapshot.yaml"
    ErrorResponse:
      $ref: "./components/schemas/ErrorResponse.yaml"
    GenerateSignedLinkRequest:
      $ref: "./components/schemas/GenerateSignedLinkRequest.yaml"
    GenerateSignedLinkData:
      $ref: "./components/schemas/GenerateSignedLinkData.yaml"
    GenerateSignedLinkResponse:
      $ref: "./components/schemas/GenerateSignedLinkResponse.yaml"
    Session:
      $ref: "./components/schemas/Session.yaml"
    PilotStateName:
      $ref: "./components/schemas/PilotStateName.yaml"
    ActiveFlightsResponse:
      $ref: "./components/schemas/ActiveFlightsResponse.yaml"
    ActiveFlightsData:
      $ref: "./components/schemas/ActiveFlightsData.yaml"
    Pagination:
      $ref: "./components/schemas/Pagination.yaml"
    TrimmedActiveFlightsResponse:
      $ref: "./components/schemas/TrimmedActiveFlightsResponse.yaml"
    TrimmedActiveFlightsData:
      $ref: "./components/schemas/TrimmedActiveFlightsData.yaml"
    TrimmedFlight:
      $ref: "./components/schemas/TrimmedFlight.yaml"
    ActiveFlightResponse:
      $ref: "./components/schemas/ActiveFlightResponse.yaml"
    ActiveFlightData:
      $ref: "./components/schemas/ActiveFlightData.yaml"
    FlightPathSync:
      $ref: "./components/schemas/FlightPathSync.yaml"
    FlightNormalized:
      $ref: "./components/schemas/FlightNormalized.yaml"
    Flight:
      $ref: "./components/schemas/Flight.yaml"
    CreateUserErrorCode:
      $ref: "./components/schemas/CreateUserErrorCode.yaml"
    CreateUserErrorResponse:
      $ref: "./components/schemas/CreateUserErrorResponse.yaml"
    CreateUserRequest:
      $ref: "./components/schemas/CreateUserRequest.yaml"
    CreateUserData:
      $ref: "./components/schemas/CreateUserData.yaml"
    CreateUserResponse:
      $ref: "./components/schemas/CreateUserResponse.yaml"
    CreateServerErrorCode:
      $ref: "./components/schemas/CreateServerErrorCode.yaml"
    CreateServerErrorResponse:
      $ref: "./components/schemas/CreateServerErrorResponse.yaml"
    CreateServerRequest:
      $ref: "./components/schemas/CreateServerRequest.yaml"
    CreateServerData:
      $ref: "./components/schemas/CreateServerData.yaml"
    CreateServerResponse:
      $ref: "./components/schemas/CreateServerResponse.yaml"
    VerifyGodData:
      $ref: "./components/schemas/VerifyGodData.yaml"
    VerifyGodResponse:
      $ref: "./components/schemas/VerifyGodResponse.yaml"
    BanUserRequest:
      $ref: "./components/schemas/BanUserRequest.yaml"
    BanUserData:
      $ref: "./components/schemas/BanUserData.yaml"
    BanUserResponse:
      $ref: "./components/schemas/BanUserResponse.yaml"
