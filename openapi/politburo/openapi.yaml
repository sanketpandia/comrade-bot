openapi: 3.0.3
info:
  title: Politburo API
  version: 0.1.0
  description: |
    Authoritative JSON contract for Politburo (Infinite Experiment backend).

    **Authentication**
    - `X-API-Key` — UUID API key for `/api/v1/*` machine clients (Discord bot, integrations).
    - `X-Discord-User-Id` and `X-Discord-Server-Id` — Discord context on bot-originated requests.
    - `session_id` cookie — browser session after signed-link login (`/api/v1/game/*`, `/api/v1/operator/*`, `/api/v1/user/me`, `/api/v1/oauth/infinite-flight`, `/api/v1/live/organizations`, `/oauth/callback`, `/api/v1/va`, `/api/v1/va/config`, `/api/v1/va/webhook/trigger`, `/api/v1/va/live/*`, and related routes).

    **Documentation** — https://sanketpandia.github.io/comrade-bot/api/reference/
tags:
  - name: Health
    description: Process and dependency readiness.
  - name: Game
    description: Cached Infinite Flight live game data.
  - name: Auth
    description: Browser session and signed links.
  - name: Users
    description: Discord user registration and account flows.
  - name: Admin
    description: Platform operator (god mode) actions.
  - name: VirtualAirline
    description: VA administrator settings and metadata.
  - name: Live
    description: Infinite Flight Live API proxies for dashboard Live Mode.
servers:
  - url: https://comradebot.cc
    description: Production
  - url: http://localhost:8082
    description: Local dev (Politburo rewrite)
  - url: http://localhost:8080
    description: Local rewrite default
