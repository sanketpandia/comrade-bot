        x-go-type: string
    queryAircraftIds:
      name: aircraftId
      in: query
      required: false
      description: |
        Persistent organization aircraft ID (`Aircraft.id`). Repeat for multiple aircraft
        (`?aircraftId=<id_1>&aircraftId=<id_2>`). Maximum 100 values. Omit to include all aircraft.
