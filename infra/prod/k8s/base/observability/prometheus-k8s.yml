global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'politburo-prod'
    env: 'production'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  - job_name: politburo
    static_configs:
      - targets: ['politburo.ie-apps.svc.cluster.local:8080']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 5s

  - job_name: comrade-bot
    static_configs:
      - targets: ['comrade-bot.ie-apps.svc.cluster.local:9091']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 5s

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor.ie-observability.svc.cluster.local:8080']
    scrape_interval: 15s
    scrape_timeout: 10s
    metric_relabel_configs:
      - source_labels: [container_label_io_kubernetes_pod_namespace]
        regex: (.+)
        target_label: namespace
        replacement: $1
      - source_labels: [container_label_io_kubernetes_pod_name]
        regex: (.+)
        target_label: pod
        replacement: $1
      - source_labels: [container_label_io_kubernetes_container_name]
        regex: (.+)
        target_label: container
        replacement: $1

  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter.ie-observability.svc.cluster.local:9100']
    scrape_interval: 15s
    scrape_timeout: 5s
