apiVersion: v1
kind: Service
metadata:
  name: politburo
  namespace: ie-apps
  labels:
    app: politburo
spec:
  ports:
    - port: 8080
      targetPort: http
      name: http
  selector:
    app: politburo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: politburo
  namespace: ie-apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: politburo
  template:
    metadata:
      labels:
        app: politburo
    spec:
      containers:
        - name: politburo
          image: politburo:main
          # Mutable :main must be re-pulled after each registry push; otherwise the node
          # keeps an older digest that may not match probe paths in this manifest.
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              hostIP: 127.0.0.1
              hostPort: 8080
              name: http
          envFrom:
            - secretRef:
                name: politburo-env
          startupProbe:
            httpGet:
              path: /health/status
              port: http
            periodSeconds: 10
            failureThreshold: 18
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health/status
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/status
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
