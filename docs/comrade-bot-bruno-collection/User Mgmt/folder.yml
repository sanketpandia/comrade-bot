docs:
  content: |-
    User registration (`Users` in OpenAPI), VA link (`POST /api/v1/memberships/link`), and `GET /api/v1/user/me` for the caller's profile and VA role.
    Bot flows use collection `X-API-Key` and Discord headers; browser sessions use a `session_id` cookie
    after signed-link login.
