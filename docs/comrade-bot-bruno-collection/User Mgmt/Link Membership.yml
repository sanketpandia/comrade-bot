info:
  name: Link Membership
  type: http
  seq: 3
  description: |
    Links the Discord user in X-Discord-User-Id to the VA for X-Discord-Server-Id.
    No request body. Caller must already exist in `users`.

    Common `error.code` values (see openapi/politburo/paths/memberships/link.yaml):
    - 401: UNAUTHORIZED
    - 403: MISSING_DISCORD_CONTEXT
    - 404: USER_NOT_FOUND, VA_NOT_FOUND
    - 409: ALREADY_MEMBER
    - 400: LINK_FAILED

http:
  method: POST
  url: "{{POLITBURO_BASE_URL}}/api/v1/memberships/link"
  headers:
    - name: accept
      value: application/json
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
