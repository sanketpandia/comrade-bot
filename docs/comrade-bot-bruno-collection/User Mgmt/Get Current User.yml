info:
  name: Get Current User
  type: http
  seq: 4

http:
  method: GET
  url: "{{politburo-base-url}}/api/v1/user/me"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  `getCurrentUser` — read the authenticated user's Politburo profile (`id`, `discordId`, `isActive`,
  optional `username` / `ifCommunityId`) and VA `role` in the current context (`null` when not a member).

  Auth: collection `X-API-Key` plus `X-Discord-User-Id` and optional `X-Discord-Server-Id`, or a browser
  `session_id` cookie after signed-link login.
