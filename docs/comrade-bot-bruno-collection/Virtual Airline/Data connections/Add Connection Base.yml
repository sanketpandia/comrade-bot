info:
  name: Add Connection Base
  type: http
  seq: 7

http:
  method: POST
  url: "{{politburo-base-url}}/api/v1/va/data-connections/connections/{{va-connection-id}}/bases"
  auth: inherit
  headers:
    - name: If-Match
      value: "{{data-connections-revision}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "secondary",
        "baseId": "<AIRTABLE_BASE_ID>"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: "`addVADataConnectionBase` — attach another physical base to an existing connection."