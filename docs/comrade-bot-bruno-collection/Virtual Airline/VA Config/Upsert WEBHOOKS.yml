info:
  name: Upsert WEBHOOKS
  type: http
  seq: 4

http:
  method: POST
  url: "{{politburo-base-url}}/api/v1/va/config?configType=WEBHOOKS"
  params:
    - name: configType
      value: WEBHOOKS
      type: query
  body:
    type: json
    data: |-
      {
        "active_flights": {
          "url": "{{discord-webhook-url}}",
          "frequency": "30m",
          "filters": {
            "pilotState": ["active"],
            "vaCode": "TEST"
          }
        }
      }
  auth: inherit

runtime:
  variables:
    - name: discord-webhook-url
      value: https://discordapp.com/api/webhooks/1480653763579609261/Pk6Vu9mWyHMCNE4anIQ9H4IAaC1nM1aMjB6lQFMdEd8vyau-GWSWjsFgMJcS8fKASUbO

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  `upsertVAConfig` — validate and store the WEBHOOKS config block.
  Set the collection variable `discord-webhook-url` to an HTTPS Discord webhook URL.
  Do not commit a real webhook secret. `active_flights` messages show `Route: —`
  until the flight cache carries route data.
