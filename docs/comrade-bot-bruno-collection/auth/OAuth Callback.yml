info:
  name: OAuth Callback
  type: http
  seq: 3

http:
  method: GET
  url: "{{politburo-base-url}}/oauth/callback"
  params:
    - name: code
      value: "{{oauth-authorization-code}}"
      type: query
      description: Authorization code from Infinite Flight redirect
    - name: state
      value: "{{oauth-state}}"
      type: query
      description: State from the authorize URL (must match pending Redis entry)
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  `completeInfiniteFlightOAuthCallback` — browser return URL registered with the Infinite Flight OAuth client
  (`{UI_BASE_URL}/oauth/callback`). Exchanges `code` for tokens, stores them in Redis, redirects to
  `/dashboard?oauth=connected` or `?oauth=error`.

  Auth: optional `session_id` cookie. Tokens are stored for the user id in pending Redis state (`auth:if_oauth:{state}`);
  a cookie is only checked when present (must match that user).

  Normally you do not call this manually; use it to replay a captured redirect while debugging. Set
  `oauth-authorization-code` and `oauth-state` from the Infinite Flight redirect query string.
