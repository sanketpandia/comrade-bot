info:
  name: Active Flights Trimmed
  type: http
  seq: 3

http:
  method: GET
  url: "{{politburo-base-url}}/api/v1/game/flights/active/trimmed"
  params:
    - name: serverId
      value: "{{politburo-server-id}}"
      type: query
      description: Normalized session name (for example casual)
    - name: pilotState
      value: active
      type: query
      description: Restrict to pilot states (repeat param for multiple values)
      disabled: true
    - name: userName
      value: ""
      type: query
      description: Username substring filter
      disabled: true
    - name: callSign
      value: ""
      type: query
      description: Callsign substring filter
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  `getTrimmedActiveFlights` — unpaged map-oriented snapshot. Each row includes an encrypted
  `flightId` token for **Active Flight Detail**.
