info:
  name: Active Flights
  type: http
  seq: 2

http:
  method: GET
  url: "{{politburo-base-url}}/api/v1/game/flights/active"
  params:
    - name: serverId
      value: "{{politburo-server-id}}"
      type: query
      description: Normalized session name (for example casual)
    - name: pilotState
      value: active
      type: query
      description: Restrict to pilot states (repeat param for multiple values)
      disabled: true
    - name: userName
      value: ""
      type: query
      description: Username substring filter
      disabled: true
    - name: callSign
      value: ""
      type: query
      description: Callsign substring filter
      disabled: true
    - name: pageNumber
      value: "1"
      type: query
      description: 1-based page number
    - name: pageLength
      value: "50"
      type: query
      description: Flights per page
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  `getActiveFlights` — paged, filtered active flights for one server (`serverId` required).

  `pilotState` values: `active`, `away_in_flight`, `away_parked`, `in_background`.
