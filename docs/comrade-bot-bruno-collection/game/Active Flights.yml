info:
  name: Active Flights
  type: http
  seq: 2

http:
  method: GET
  url: "{{politburo-base-url}}/api/v1/game/flights/active/{{politburo-server-id}}"
  params:
    - name: pageNumber
      value: "1"
      type: query
      description: 1-based page number
    - name: pageLength
      value: "50"
      type: query
      description: Flights per page
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  `getActiveFlights` — paged motion tracks for active flights on one server (`normalizedServerName` path segment).
