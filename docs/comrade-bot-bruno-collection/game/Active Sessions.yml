info:
  name: Active Sessions
  type: http
  seq: 1

http:
  method: GET
  url: "{{politburo-base-url}}/api/v1/game/flights/active"
  params:
    - name: history
      value: "false"
      type: query
      description: Include the last 50 cached snapshots when true
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: "`getActiveSessions` — read the latest active Infinite Flight sessions from cache."
