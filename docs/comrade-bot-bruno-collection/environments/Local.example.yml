name: Local
variables:
  - name: politburo-api-key
    value: ""
    description: UUID from api_keys (see services/politburo .env)
  - name: politburo-base-url
    value: http://localhost:8082
    description: Politburo rewrite in local dev (8080 in prod compose)
  - name: politburo-server-id
    value: casual
    description: Normalized session name for active-flight endpoints
  - name: discord-user-id
    value: ""
    description: Discord snowflake for signed-link and bot-style calls
  - name: discord-server-id
    value: ""
    description: Optional guild id stored on session when minting signed links
  - name: flight-id
    value: ""
    description: Encrypted token from trimmed active flights (flightId field)
