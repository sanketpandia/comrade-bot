opencollection: 1.0.0

info:
  name: Comrade-Bot-Bruno-Collection
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  headers:
    - name: X-API-Key
      value: "{{politburo-api-key}}"
    - name: X-Discord-User-Id
      value: "{{discord-user-id}}"
    - name: X-Discord-Server-Id
      value: "{{discord-server-id}}"
  variables:
    - name: politburo-base-url
      value: http://localhost:8082
    - name: politburo-api-key
      value: ""
    - name: discord-user-id
      value: ""
    - name: discord-server-id
      value: ""
    - name: data-connections-revision
      value: "0"
    - name: va-connection-id
      value: ""
    - name: va-base-setup-id
      value: ""
    - name: airtable-base-id
      value: ""
    - name: data-connection-entity
      value: pilots
    - name: map-stats-if-match
      value: "0"
    - name: map-pirep-if-match
      value: "0"
    - name: connections-revision-for-features
      value: "0"
    - name: stats-test-ifc-username
      value: ""
    - name: stats-test-callsign
      value: ""
    - name: pirep-value-mappings-if-match
      value: "0"
    - name: discord-webhook-url
      value: ""
    - name: ban-target-discord-user-id
      value: ""
    - name: POLITBURO_BASE_URL
      value: "{{politburo-base-url}}"
    - name: IFC_ID
      value: ""
    - name: lastFlight
      value: ""
    - name: flight-id
      value: ""
    - name: oauth-authorization-code
      value: ""
    - name: oauth-state
      value: ""
    - name: live-organization-id
      value: ""
    - name: live-aircraft-id
      value: ""
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
