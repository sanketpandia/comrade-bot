opencollection: 1.0.0

info:
  name: Comrade-Bot-Bruno-Collection
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  headers:
    - name: X-API-Key
      value: "{{politburo-api-key}}"
    - name: X-Discord-User-Id
      value: "{{discord-user-id}}"
    - name: X-Discord-Server-Id
      value: "{{discord-server-id}}"
  variables:
    - name: POLITBURO_BASE_URL
      value: "{{politburo-base-url}}"
    - name: IFC_ID
      value: John370
    - name: lastFlight
      value: RCTP-RJFC
    - name: flight-id
      value: 90cdb286-d470-4dd1-9f45-688f1acf583c
    - name: oauth-authorization-code
      value: ""
    - name: oauth-state
      value: ""
    - name: live-organization-id
      value: 258538ec-ffb1-4583-9665-2f3975bef4a7
    - name: live-aircraft-id
      value: d05599b6-c70a-46e3-bf5d-d9d9959d9498
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
