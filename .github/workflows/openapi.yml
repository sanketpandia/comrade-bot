name: OpenAPI

on:
  pull_request:
    paths:
      - 'openapi/**'
      - 'cicd/**'
      - 'Makefile'
  push:
    branches: [main]
    paths:
      - 'openapi/**'
      - 'cicd/**'
      - 'Makefile'

permissions:
  contents: read

jobs:
  generate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            cicd/package-lock.json
            services/comrade-bot-discord/package-lock.json

      - name: Install bot dependencies
        working-directory: services/comrade-bot-discord
        run: npm ci

      - name: Check bundled Politburo spec is up to date
        run: make openapi-bundle-check

      - name: Generate bindings
        run: make generate

      - name: Build Politburo
        run: |
          cd services/politburo
          go test ./...
          go build -buildvcs=false ./cmd/politburo

      - name: Build Discord bot
        run: |
          cd services/comrade-bot-discord
          npm ci
          npm run build

      - name: Discord notify
        if: always() && failure()
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          title: OpenAPI CI
          status: failure
          job-name: generate-and-build
