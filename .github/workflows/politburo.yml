name: Politburo CI

on:
  pull_request:
    paths:
      - 'services/politburo/**'
      - 'openapi/**'
      - 'cicd/**'
      - 'Makefile'
      - '.github/workflows/politburo.yml'
  push:
    branches: [main]
    paths:
      - 'services/politburo/**'
      - 'openapi/**'
      - 'cicd/**'
      - 'Makefile'
      - '.github/workflows/politburo.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Generate, test, and build (Dockerfile.dev ci target)
        run: docker build --file services/politburo/Dockerfile.dev --target ci --tag politburo-ci:${{ github.sha }} .

  notify-test:
    needs: test
    if: always() && needs.test.result == 'failure'
    runs-on: ubuntu-latest
    environment: production
    continue-on-error: true
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Discord notify
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL || secrets.WEBHOOK_URL || vars.DISCORD_WEBHOOK_URL || vars.WEBHOOK_URL }}
          title: Politburo CI — test
          status: failure
          job-name: test

  production-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: test
    environment: production
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ghcr.outputs.prefix }}/politburo:${{ github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set GHCR image prefix
        id: ghcr
        run: echo "prefix=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push production image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/politburo/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.ghcr.outputs.prefix }}/politburo:${{ github.sha }}
            ${{ steps.ghcr.outputs.prefix }}/politburo:main

      - name: Discord notify
        if: always() && (failure() || (success() && github.event_name == 'push' && github.ref == 'refs/heads/main'))
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL || secrets.WEBHOOK_URL || vars.DISCORD_WEBHOOK_URL || vars.WEBHOOK_URL }}
          title: Politburo CI — production-image
          status: ${{ job.status }}
          job-name: production-image
          details: ${{ steps.ghcr.outputs.prefix }}/politburo:${{ github.sha }}

  deploy:
    needs: production-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, prod]
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure kubeconfig from secret
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          if [ -z "${KUBECONFIG_B64}" ]; then
            echo "KUBECONFIG_B64 not set; using runner kubeconfig"
            exit 0
          fi
          mkdir -p "$HOME/.kube"
          echo "$KUBECONFIG_B64" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Ensure GHCR imagePullSecret
        env:
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          if [ -z "${GHCR_TOKEN}" ]; then
            echo "GHCR_PULL_TOKEN not set; skipping imagePullSecret refresh"
            exit 0
          fi
          kubectl create secret docker-registry ghcr-cred -n ie-apps \
            --docker-server=ghcr.io \
            --docker-username="$GHCR_USER" \
            --docker-password="$GHCR_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Roll out politburo
        env:
          IMAGE: ${{ needs.production-image.outputs.image }}
        run: |
          kubectl -n ie-apps set image deployment/politburo politburo="$IMAGE"
          kubectl -n ie-apps rollout status deployment/politburo --timeout=5m

      - name: Discord notify
        if: always() && (failure() || success())
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL || secrets.WEBHOOK_URL || vars.DISCORD_WEBHOOK_URL || vars.WEBHOOK_URL }}
          title: Politburo deploy (lalquila)
          status: ${{ job.status }}
          job-name: deploy
          details: ${{ needs.production-image.outputs.image }}
