name: Discord bot CI

on:
  pull_request:
    paths:
      - 'services/comrade-bot-discord/**'
      - 'openapi/**'
      - 'cicd/**'
      - 'Makefile'
      - '.github/workflows/discord-bot.yml'
  push:
    branches: [main]
    paths:
      - 'services/comrade-bot-discord/**'
      - 'openapi/**'
      - 'cicd/**'
      - 'Makefile'
      - '.github/workflows/discord-bot.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/comrade-bot-discord/package-lock.json

      - name: Install, generate client, test, and build
        working-directory: services/comrade-bot-discord
        run: |
          npm ci
          npm run api:generate
          npm test
          npm run build

  production-image:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set GHCR image prefix
        id: ghcr
        run: echo "prefix=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/comrade-bot-discord/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.ghcr.outputs.prefix }}/comrade-bot:${{ github.sha }}
            ${{ steps.ghcr.outputs.prefix }}/comrade-bot:main
