name: Discord bot CI

on:
  pull_request:
    paths:
      - 'services/comrade-bot-discord/**'
      - 'openapi/**'
  push:
    branches: [main]
    paths:
      - 'services/comrade-bot-discord/**'
      - 'openapi/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/comrade-bot-discord/package-lock.json

      - name: Install, generate client, test, and build
        working-directory: services/comrade-bot-discord
        run: |
          npm ci
          npm run api:generate
          npm test
          npm run build

  production-image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build production image
        run: docker build --file services/comrade-bot-discord/Dockerfile --tag comrade-bot:${{ github.sha }} .
