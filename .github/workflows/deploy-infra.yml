name: Deploy k8s manifests

on:
  push:
    branches: [main]
    paths:
      - 'infra/prod/k8s/**'
      - '.github/workflows/deploy-infra.yml'

permissions:
  contents: read

jobs:
  apply:
    runs-on: [self-hosted, linux, prod]
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure kubeconfig from secret
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          if [ -z "${KUBECONFIG_B64}" ]; then
            echo "KUBECONFIG_B64 not set; using runner kubeconfig"
            exit 0
          fi
          mkdir -p "$HOME/.kube"
          echo "$KUBECONFIG_B64" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Apply prod overlay
        run: bash infra/prod/k8s/apply.sh

      - name: Discord notify
        if: always() && (failure() || success())
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          title: k8s manifest apply (lalquila)
          status: ${{ job.status }}
          job-name: apply
