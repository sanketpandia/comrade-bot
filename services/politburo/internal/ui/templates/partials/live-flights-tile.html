{{define "live-flights-tile"}}
<section class="panel panel--spaced">
  <h2 class="panel-heading">Live flights</h2>
  <p class="panel-lead">Open the map for an Infinite Flight server.</p>
  <div class="link-row">
    {{range .Servers}}
    <a class="btn" href="/maps/flights/active?serverId={{.ID}}">{{.Label}}</a>
    {{end}}
  </div>
</section>
{{end}}
