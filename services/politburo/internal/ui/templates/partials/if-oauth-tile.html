{{define "if-oauth-tile"}}
{{if .IFOAuthEnabled}}
<section class="panel panel--spaced">
  <h2 class="panel-heading">Infinite Flight account</h2>
  <p class="panel-lead">Connect your Infinite Flight account for Live API access.</p>
  {{if eq .OAuthStatus "connected"}}
  <p class="panel-lead status-ok">Connected to Infinite Flight.</p>
  {{else if eq .OAuthStatus "error"}}
  <p class="panel-lead status-error">Connection failed. Try again.</p>
  {{end}}
  <div class="link-row">
    <button type="button" class="btn" id="if-oauth-connect">Connect Infinite Flight</button>
  </div>
</section>
{{end}}
{{end}}
