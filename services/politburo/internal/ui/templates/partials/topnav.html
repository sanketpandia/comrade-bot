{{define "topnav"}}
<header class="topbar">
  <nav class="topbar__nav" aria-label="Primary">
    <a class="topbar__link" href="/dashboard"{{if eq .Content "dashboard-content"}} aria-current="page"{{end}}>Dashboard</a>
    {{if eq .Role "administrator"}}
    <a class="topbar__link" href="/admin/general"{{if eq .Content "admin-content"}} aria-current="page"{{end}}>Admin</a>
    {{end}}
    <button type="button" class="topbar__profile" aria-label="Profile">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4zm0 2c-3.3 0-8 1.7-8 5v1h16v-1c0-3.3-4.7-5-8-5z"/>
      </svg>
    </button>
  </nav>
</header>
{{end}}
