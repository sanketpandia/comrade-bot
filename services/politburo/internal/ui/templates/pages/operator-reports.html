{{define "operator-reports"}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{if .Title}}{{.Title}}{{else}}Operator reports{{end}}</title>
  <link rel="stylesheet" href="/static/css/base.css">
</head>
<body>
  <main>
    <h1>Operator report queue</h1>
    {{if not .Reports}}
    <p>No open reports.</p>
    {{else}}
    <ul>
      {{range .Reports}}
      <li>
        <strong>{{.Kind}}</strong>
        {{if .ClaimedIFC}} — IFC: {{.ClaimedIFC}}{{end}}
        <form method="post" action="/operator/reports/{{.ID}}/resolve" style="display:inline">
          <button type="submit">Resolve</button>
        </form>
      </li>
      {{end}}
    </ul>
    {{end}}
  </main>
</body>
</html>
{{end}}
