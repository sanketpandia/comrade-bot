{{define "admin-content"}}
<h1>Admin</h1>
<div class="admin-layout">
  <nav class="admin-tabs" aria-label="Admin sections">
    <a class="admin-tabs__link" href="/admin/general"{{if eq .AdminTab "general"}} aria-current="page"{{end}}>General</a>
  </nav>
  <section class="admin-panel tile" aria-labelledby="admin-general-heading">
    <h2 id="admin-general-heading">General</h2>
    <p class="admin-panel__lead">Virtual airline settings for this server.</p>
    <p id="admin-general-status" class="admin-panel__status" role="status" hidden></p>
    <form class="admin-form" id="admin-general-form">
      <div class="admin-field">
        <label for="va-code">VA code</label>
        <input id="va-code" name="code" type="text" readonly autocomplete="off" placeholder="Loading…">
      </div>
    </form>
  </section>
</div>
{{end}}
