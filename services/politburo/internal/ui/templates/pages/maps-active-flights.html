{{define "maps-active-flights-content"}}
<div class="maps-shell {{.Maps.Chrome.ShellClass}}" id="maps-shell"
     data-detail-enabled="{{if .Maps.Chrome.DetailRailEnabled}}1{{else}}0{{end}}"
     data-embed="{{if .Maps.Chrome.Embed}}1{{else}}0{{end}}">
  <div class="maps-map-area">
    <div id="leaflet-map" aria-label="Active flights map" hx-preserve="true"></div>
    {{if .Maps.Chrome.ShowMapOnlyButton}}
    <button type="button" class="maps-map-only" id="maps-map-only" aria-pressed="false">Map only</button>
    {{end}}
    <div class="maps-filters-wrap">
      <button type="button" class="maps-filters-toggle" id="maps-filters-toggle" aria-expanded="{{if .Maps.Chrome.FiltersOpen}}true{{else}}false{{end}}">
        Filters <span class="maps-filters-toggle__count" id="maps-filters-toggle-count"></span>
      </button>
      <form class="maps-filters" id="maps-filters"
            hx-get="/maps/flights/active/flights"
            hx-target="#maps-flights-swap"
            hx-swap="innerHTML transition:true"
            hx-trigger="load, every 60s, change, keyup changed delay:300ms from:input[type=search]">
        {{range $k, $v := .Maps.ChromeHidden}}
        <input type="hidden" name="{{$k}}" value="{{$v}}">
        {{end}}
        <div id="maps-flights-swap" class="maps-flights-swap">
          <div class="maps-filters__status">
            <span id="maps-count">0 flights</span>
            <span id="maps-cached"></span>
            <span id="maps-error" hidden></span>
          </div>
        </div>
        <div class="maps-filters__toolbar">
          <button type="button" class="maps-filters__collapse" id="maps-filters-collapse" aria-label="Collapse filters">−</button>
        </div>
        <label class="maps-filters__field">
          Server
          <select id="maps-server" name="serverId"
                  hx-get="/maps/flights/active/servers{{if .Maps.ServerID}}?serverId={{.Maps.ServerID}}{{end}}"
                  hx-trigger="load"
                  hx-swap="innerHTML">
            {{if .Maps.ServerID}}<option value="{{.Maps.ServerID}}" selected>{{.Maps.ServerID}}</option>{{end}}
          </select>
        </label>
        <fieldset class="maps-filters__states">
          <legend>Pilot state</legend>
          <label class="maps-filters__chip maps-filters__chip--active">
            <input type="checkbox" name="pilotState" value="active"{{if pilotStateChecked .Maps.PilotStates "active"}} checked{{end}}> Active
          </label>
          <label class="maps-filters__chip maps-filters__chip--away-flight">
            <input type="checkbox" name="pilotState" value="away_in_flight"{{if pilotStateChecked .Maps.PilotStates "away_in_flight"}} checked{{end}}> Away in flight
          </label>
          <label class="maps-filters__chip maps-filters__chip--away-parked">
            <input type="checkbox" name="pilotState" value="away_parked"{{if pilotStateChecked .Maps.PilotStates "away_parked"}} checked{{end}}> Away parked
          </label>
          <label class="maps-filters__chip maps-filters__chip--background">
            <input type="checkbox" name="pilotState" value="in_background"{{if pilotStateChecked .Maps.PilotStates "in_background"}} checked{{end}}> In background
          </label>
        </fieldset>
        <label class="maps-filters__check">
          <input id="maps-show-callsigns" name="showCallsigns" type="checkbox" value="1"{{if .Maps.ShowCallsigns}} checked{{end}}>
          Show callsigns
        </label>
        <label class="maps-filters__field">
          Callsign
          <input id="maps-callsign" name="callSign" type="search" autocomplete="off" value="{{.Maps.CallSign}}">
        </label>
        <label class="maps-filters__field">
          Username
          <input id="maps-username" name="userName" type="search" autocomplete="off" value="{{.Maps.UserName}}">
        </label>
        <label class="maps-filters__field">
          VA code
          <input id="maps-vacode" name="vaCode" type="search" autocomplete="off" value="{{.Maps.VACode}}">
        </label>
      </form>
    </div>
  </div>
  <aside id="maps-detail-panel" class="maps-detail-panel" hidden aria-label="Flight details">
    <header class="maps-detail-panel__header">
      <div class="maps-detail-panel__tabs" role="tablist" id="maps-detail-tabs">
        <a class="maps-detail-panel__tab maps-detail-panel__tab--active" role="tab"
           href="#" data-tab="flight" aria-selected="true">Flight</a>
        <a class="maps-detail-panel__tab" role="tab"
           href="#" data-tab="route" aria-selected="false">Route</a>
        <a class="maps-detail-panel__tab" role="tab"
           href="#" data-tab="user" aria-selected="false">User</a>
      </div>
      <button type="button" class="maps-detail-panel__close" id="maps-detail-close" aria-label="Close flight details">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M18.3 5.71 12 12l6.3 6.29-1.41 1.42L10.59 13.4 4.29 19.71 2.88 18.3 9.17 12 2.88 5.71 4.29 4.3 10.59 10.6l6.29-6.3z"/></svg>
      </button>
    </header>
    <div class="maps-detail-panel__body" id="maps-detail-body">
      <p class="maps-detail-panel__empty">Select a flight on the map to view details.</p>
    </div>
  </aside>
</div>
{{end}}
