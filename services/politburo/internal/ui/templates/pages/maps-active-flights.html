{{define "maps-active-flights-content"}}
<div class="maps-shell">
  <div id="leaflet-map" aria-label="Active flights map"></div>
  <form class="maps-filters" id="maps-filters">
    <div class="maps-filters__status">
      <span id="maps-count">0 flights</span>
      <span id="maps-cached"></span>
      <span id="maps-error" hidden></span>
    </div>
    <label class="maps-filters__field">
      Server
      <select id="maps-server" name="serverId"
              hx-get="/maps/flights/active/servers{{if .ServerID}}?serverId={{.ServerID}}{{end}}"
              hx-trigger="load"
              hx-swap="innerHTML"></select>
    </label>
    <fieldset class="maps-filters__states">
      <legend>Pilot state</legend>
      <label><input type="checkbox" name="pilotState" value="active"> Active</label>
      <label><input type="checkbox" name="pilotState" value="away_in_flight"> Away in flight</label>
      <label><input type="checkbox" name="pilotState" value="away_parked"> Away parked</label>
      <label><input type="checkbox" name="pilotState" value="in_background"> In background</label>
    </fieldset>
    <label class="maps-filters__check">
      <input id="maps-show-callsigns" name="showCallsigns" type="checkbox" checked>
      Show callsigns
    </label>
    <label class="maps-filters__field">
      Callsign
      <input id="maps-callsign" name="callSign" type="search" autocomplete="off">
    </label>
    <label class="maps-filters__field">
      Username
      <input id="maps-username" name="userName" type="search" autocomplete="off">
    </label>
  </form>
</div>
{{end}}
